- aid: kareo:kareo-clinical-open-api
  name: Kareo Clinical Open API
  description: >-
    The Kareo Clinical Open API provides REST-based access to EHR clinical data, exposing patient clinical
    records, MACRA/MIPS reporting data, and related healthcare information. The API is documented with
    a Swagger UI interface and is accessible via api.kareo.com.
