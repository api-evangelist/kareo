apis:
- aid: kareo:kareo-soap-api
  name: Kareo Integration SOAP API
  description: >-
    The Kareo Integration SOAP API provides a web services interface for integrating third-party applications
    with practice management data. Supports read access to patients, providers, appointments, transactions,
    and charges, as well as write access to patients and encounters. Authentication requires a username,
    password, and a Customer Key issued by a System Administrator.
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
